seed: 42

data:
  root_dir: "archive"
  num_frames: 16
  frame_size: 160
  train_val_split: 0.8
  frame_step: 1
  sampling: "rand_uniform"
  augmentation: "strong"
  strong_aug: false
  focus_court: "full"
  use_cache: false
  cache_dir: "frame_cache"

training:
  batch_size: 4
  num_epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.00001
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  device: "mps"
  use_channels_last: true
  scheduler: "cosine"
  use_amp: true
  grad_clip: 1.0
  label_smoothing: 0.0
  early_stopping_patience: 6
  class_weighting: "none"
  sampler: "none"
  boost_class: null
  boost_factor: 1.0

model:
  backbone: "r3d_18"
  pretrained: true

logging:
  log_interval: 5
  output_dir: "runs/v2_highcap_stable"
