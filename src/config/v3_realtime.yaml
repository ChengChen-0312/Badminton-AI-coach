video:
  root_dir: "archive"

device:
  yolo_device: "cpu"       # YOLO often runs faster/more stable on CPU for Mac + ultralytics
  classifier_device: "mps"

vision:
  yolo_imgsz: 512
  yolo_conf: 0.25
  edge_top_min: 0.20
  edge_bottom_min: 0.18
  edge_min_floor: 0.10

  court_detector_method: "model_fit"  # "heuristic" | "farin2005" | "model_fit"

  top_crop_ratio: 0.05
  floor_close_kernel: 45              # 比 35 更容易桥接网导致的断裂
  floor_close_iter: 2                 # 迭代一次常常不够

  min_confidence: 0.45                # 先放宽，先确保能出 corners（之后再升回 0.60）
  court_min_span_x_norm: 0.75         # 避免选到内部小矩形（先中等偏紧）
  court_min_span_y_norm: 0.70
  court_tpl_weight: 0.40              # 更依赖模板匹配，压制发球区矩形

  net_suppress_y_min: 0.35
  net_suppress_y_max: 0.60
  net_penalty: 0.60
  tpl_net_reject_max: 0.14
  top_edge_net_reject_max: 0.18

  court_bottom_min_y_norm: 0.78

  gap_scan_enable: true
  gap_row_density_thresh: 0.003
  gap_min_height_norm: 0.03
  gap_penalty_or_reject: "reject"     # "reject" | "penalty"
  gap_penalty: 0.60
  use_court_roi: false
  court_roi_margin: 0.05

  yolo_model: "yolov8n.pt"
  ball_model: "yolov8n.pt"
  ball_allow_all_if_empty: true
tracking:
  detect_stride: 1
  max_age: 10
  ball_max_age: 8
  iou_thresh: 0.3

realtime:
  target_fps: 30
  batch_size: 2

spatial_logic:
  enable_hitter_inference: true
  hitter_distance_max: 200.0

visualization:
  enable_heatmap: true
  enable_timeline: true
  heatmap_bins: 32

pose:
  enable: true
  backend: mediapipe
  stride: 2      # 可调
  window: 3      # contact 帧±3 帧内找最近 pose
