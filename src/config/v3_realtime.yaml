video:
  root_dir: "archive"

device:
  yolo_device: "cpu"       # YOLO often runs faster/more stable on CPU for Mac + ultralytics
  classifier_device: "mps"

vision:
  yolo_imgsz: 512
  yolo_conf: 0.25
  use_court_roi: false
  court_roi_margin: 0.05
  yolo_model: "yolov8n.pt"
  ball_model: "yolov8n.pt"
  ball_allow_all_if_empty: true

tracking:
  detect_stride: 1
  max_age: 10
  ball_max_age: 8
  iou_thresh: 0.3

realtime:
  target_fps: 30
  batch_size: 2

spatial_logic:
  enable_hitter_inference: true
  hitter_distance_max: 200.0
