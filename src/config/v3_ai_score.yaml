device:
  yolo_device: "cpu"
  classifier_device: "mps"

vision:
  yolo_imgsz: 512
  yolo_conf: 0.25
  edge_top_min: 0.20
  edge_bottom_min: 0.18
  edge_min_floor: 0.10
  use_court_roi: false
  yolo_model: "yolov8n.pt"
  ball_model: "yolov8n.pt"
  ball_allow_all_if_empty: true

tracking:
  detect_stride: 1
  max_age: 10
  ball_max_age: 8
  iou_thresh: 0.3

realtime:
  target_fps: 30
  batch_size: 2

spatial_logic:
  enable_hitter_inference: true
  hitter_distance_max: 200.0

visualization:
  enable_heatmap: true
  enable_timeline: true
  heatmap_bins: 32

ai_score:
  mode: "student"       # student | teacher32b | teacher78b
  teacher_api: "http://localhost:8000/v1/inference"
