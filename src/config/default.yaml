seed: 42

data:
  root_dir: "archive"
  num_frames: 16
  frame_size: 224
  train_val_split: 0.8
  frame_step: 1

training:
  batch_size: 4
  num_epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  device: "cuda"

model:
  backbone: "r3d_18"
  pretrained: true

logging:
  log_interval: 10
  output_dir: "runs/stroke_baseline"
