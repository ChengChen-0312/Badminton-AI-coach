seed: 42

data:
  root_dir: "archive"
  num_frames: 8
  frame_size: 112
  train_val_split: 0.8
  frame_step: 1

training:
  batch_size: 4
  num_epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  device: "mps"
  use_channels_last: true

model:
  backbone: "r3d_18"
  pretrained: true

logging:
  log_interval: 5
  output_dir: "runs/stroke_baseline"
