seed: 42

data:
  root_dir: "archive"
  num_frames: 16
  frame_size: 160
  train_val_split: 0.8
  frame_step: 1
  sampling: "uniform"
  augmentation: "strong"

training:
  batch_size: 4
  num_epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4
  device: "mps"
  use_channels_last: true
  scheduler: "cosine"
  use_amp: true
  grad_clip: 1.0
  label_smoothing: 0.1
  early_stopping_patience: 5

model:
  backbone: "r3d_18"
  pretrained: true

logging:
  log_interval: 5
  output_dir: "runs/v2_high_accuracy"
