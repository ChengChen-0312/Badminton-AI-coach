name: release-gate

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml opencv-python
      - name: Run compile + tests + monitor
        run: |
          python scripts/run_regression_suite.py --report tests/assets/sample_report.json
      - name: Collect gate outputs
        run: |
          mkdir -p reports/release_gate
          python scripts/monitor_report_quality.py \
            --report tests/assets/sample_report.json \
            --out reports/release_gate/sample_report_quality.json
          cp -R ios/BadmintonAICoach reports/release_gate/ios_mvp
          cp docs/ios_mvp_architecture.md reports/release_gate/
          cp docs/stroke_6class_contract.md reports/release_gate/
      - name: Upload release gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifact
          path: reports/release_gate
